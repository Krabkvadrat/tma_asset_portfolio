name: CI

# Runs on every PR, and is called by deploy.yml so nothing reaches the Pi
# without passing it.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Same engine as prod. The database name must contain "test" or the
      # suite refuses to run (it deletes all rows between tests).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/portfolio_test
      DATABASE_URL_SYNC: postgresql+psycopg2://user:password@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
