services:
  backend:
    build: ./backend
    # Explicit tag (instead of the project-name-derived default) so
    # scripts/deploy.sh can keep a :prev image and roll back deterministically.
    image: tma-portfolio-backend:prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-portfolio}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-portfolio}
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-[]}
      - FIAT_RATE_API_URL=${FIAT_RATE_API_URL:-https://api.exchangerate-api.com/v4/latest}
      - COINGECKO_API_URL=${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      - FIAT_CACHE_TTL=${FIAT_CACHE_TTL:-3600}
      - CRYPTO_CACHE_TTL=${CRYPTO_CACHE_TTL:-300}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tma-portfolio-frontend:prod
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    # Named tunnel: which hostname it serves and that it routes to nginx:80 are
    # configured in the Cloudflare dashboard and keyed by this token, so the
    # public URL survives restarts. The token is passed through the environment
    # rather than argv, where `ps` and `docker inspect` would expose it; both
    # deploy scripts refuse to run without it, so it stays a plain `:-` default
    # here and `down`/`logs`/`ps` keep working on a Pi with an empty .env.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
